[project]
name = "agentd"
version = "0.1.0"
description = "Agent Studio backend: event bus, provider adapters, agent runtime."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "keyring>=25",
    "openai>=1.55",
    "anthropic>=0.40",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "datamodel-code-generator>=0.26",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung socket test is otherwise indistinguishable from a slow one: pytest just
# stops printing. The thread method dumps the stack of every thread on timeout,
# which is what located the subscribe-after-accept race.
timeout = 60
timeout_method = "thread"

[project]
name = "agentd"
version = "0.1.0"
description = "Agent Studio backend: event bus, provider adapters, agent runtime."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "keyring>=25",
    "openai>=1.55",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

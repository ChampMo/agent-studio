; ASCII ONLY, and no BOM. Alembic hands this file to configparser, which opens
; it with the *locale* encoding rather than UTF-8. On a machine whose locale is
; not UTF-8 (this one is cp874), a single non-ASCII character or a UTF-8 BOM
; makes every migration fail with a UnicodeDecodeError. Section references are
; spelled out in words here for that reason.

[alembic]
script_location = agentd/db/migrations
prepend_sys_path = .
path_separator = os

; No sqlalchemy.url here on purpose. The URL comes from agentd.core.config, the
; one place allowed to decide where the user's data lives (brief section 4.3),
; so dev, tests and a packaged build cannot disagree about which database they
; are migrating.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

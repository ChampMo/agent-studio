[package]
name = "agent-studio"
version = "0.1.0"
description = "Agent Studio desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Spawns the frozen backend as a bundled sidecar and, crucially, can write to
# its stdin - which is how the session token gets there without ever touching
# argv or the environment (PROJECT_BRIEF.md section 9.1).
tauri-plugin-shell = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
